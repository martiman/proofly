    get:
      tags: [Settings]
      operationId: listApprovals
      summary: Approval requests (resolutions, adjustments, sign-off, config, manual matches) awaiting the caller
      x-required-permission: approval.view
      parameters:
        - {name: objectType, in: query, schema: {$ref: '#/components/schemas/ApprovalObjectType'}}
        - {name: mine, in: query, description: "Only items I may decide (excludes own proposals)", schema: {type: boolean, default: true}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token from the customer identity provider. Roles and scope are resolved server-side (see /me).
  headers:
    ETag:
      description: Opaque strong validator of the current resource version; send back in `If-Match`.
      schema: {type: string}
    RequestId:
      description: Echo of X-Request-Id (or server generated).
      schema: {type: string}
  parameters:
    RunId: {name: runId, in: path, required: true, description: "Run version id; a new id is issued per reprocess.", schema: {type: string}}
    DeliveryId: {name: deliveryId, in: path, required: true, schema: {type: string}}
    ExceptionId: {name: exceptionId, in: path, required: true, schema: {type: string, examples: [F-019]}}
    TransactionId: {name: transactionId, in: path, required: true, schema: {type: string, examples: [TRF-004]}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 25}}
    Cursor: {name: cursor, in: query, description: "Opaque cursor from `page.nextCursor`.", schema: {type: string}}
    IncludeTotal: {name: includeTotal, in: query, description: "Include exact `page.total` (may be slower).", schema: {type: boolean, default: false}}
    Search: {name: search, in: query, schema: {type: string, maxLength: 200}}
    IfMatch: {name: If-Match, in: header, required: true, description: "ETag of the target resource as last read. Missing -> 428; stale -> 412.", schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, description: "Client-generated UUID. Replays within 24h return the original response; same key with a different body -> 422.", schema: {type: string, format: uuid}}
    RequestId: {name: X-Request-Id, in: header, required: false, description: "Client correlation id (UUID). Propagated to logs and audit events.", schema: {type: string, format: uuid}}
  requestBodies:
    ReasonOnly:
      required: true
      content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {$ref: '#/components/schemas/Reason'}}}}}
  responses:
    Unauthorized: {description: "Missing or invalid credentials", headers: {WWW-Authenticate: {schema: {type: string}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: 'Permission, legal-entity scope or separation-of-duties violation (type: forbidden | out-of-scope | separation-of-duties)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: "Not found (or outside caller's scope)", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: 'State conflict (type: invalid-state | run-superseded | stale-signoff | idempotency-in-progress | duplicate)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionFailed: {description: "If-Match does not match current ETag; re-read and retry", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionRequired: {description: "If-Match header missing", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unprocessable: {description: "Validation failed (reason missing, bad filter, bad body)", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, examples: ['https://proofly.example/problems/separation-of-duties']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        requestId: {type: string}
        errors:
          type: array
          description: Field-level validation errors (422).
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: {type: string, description: "JSON Pointer or query parameter name"}
              message: {type: string}
              code: {type: string}
      additionalProperties: true
    Reason: {type: string, minLength: 3, maxLength: 4000, description: "Mandatory rationale recorded in the audit event."}
    DecimalString: {type: string, pattern: '^-?\d+(\.\d{1,6})?$', examples: ['-50.00']}
    Currency: {type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217", examples: [EUR]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/DecimalString'}
        currency: {$ref: '#/components/schemas/Currency'}
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
        total: {type: integer, description: "Present when includeTotal=true"}
    IsoDate: {type: string, format: date}
    Severity: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW]}
    ControlArea: {type: string, enum: [data_completeness, matching, independent_ledger, transaction_lifecycle, safeguarding]}
    ControlState: {type: string, enum: [PASSED, REVIEW_REQUIRED, FAILED, BLOCKED, QUALIFIED]}
    RunState: {type: string, enum: [AWAITING_EVIDENCE, PROCESSING, REVIEW_REQUIRED, READY_FOR_SIGN_OFF, SIGNED_OFF, SUPERSEDED, FAILED]}
    SignOffState: {type: string, enum: [PREPARATION_INCOMPLETE, READY_FOR_REVIEW, RETURNED, APPROVAL_PENDING, SIGNED_OFF, INVALIDATED, SUPERSEDED]}
    ExceptionStatus: {type: string, enum: [OPEN, IN_INVESTIGATION, WAITING_FOR_DATA, PENDING_APPROVAL, RESOLVED, ACCEPTED_DIFFERENCE, FALSE_POSITIVE]}
    ResolutionKind: {type: string, enum: [RESOLVED, ACCEPTED_DIFFERENCE, FALSE_POSITIVE]}
    TransactionKind: {type: string, enum: [BANK_TRANSFER, DIRECT_DEBIT, CARD, BANK_EVIDENCE, LEDGER_ENTRY]}
    MatchStatus: {type: string, enum: [MATCHED, UNMATCHED, VALUE_MISMATCH, NOT_APPLICABLE, PENDING_APPROVAL]}
    AdjustmentStatus: {type: string, enum: [PROPOSED, APPROVED, REJECTED, EXPIRED]}
    SafeguardingState: {type: string, enum: [COVERED, SHORTFALL, SURPLUS, QUALIFIED, NO_OBLIGATION]}
    DeliveryState: {type: string, enum: [RECEIVED, LATE, MISSING, REJECTED, SUPERSEDED, QUALIFIED]}
    ActorType: {type: string, enum: [USER, SYSTEM, SERVICE_ACCOUNT], description: "Who performed the action."}
    AuditSubjectKind: {type: string, enum: [RUN, DELIVERY, RECORD, EXCEPTION, EVIDENCE_PACK, ADJUSTMENT, SIGN_OFF, CONFIG, MATCH_GROUP]}
    AuditEventType:
      type: string
      enum:
        - DELIVERY_RECEIVED
        - RECORD_REJECTED
        - DELIVERY_INGESTION_RETRIED
        - DELIVERY_SUPERSEDED
        - RUN_STARTED
        - RUN_REPROCESS_REQUESTED
        - CONTROL_EXECUTED
        - EXCEPTION_CREATED
        - EXCEPTION_ASSIGNED
        - NOTE_ADDED
        - EVIDENCE_REQUESTED
        - RESOLUTION_PROPOSED
        - RESOLUTION_DECIDED
        - EXCEPTION_REOPENED
        - MANUAL_MATCH_PROPOSED
        - ADJUSTMENT_PROPOSED
        - ADJUSTMENT_DECIDED
        - SIGN_OFF_SUBMITTED
        - SIGN_OFF_RETURNED
        - RUN_SIGNED_OFF
        - EVIDENCE_PACK_GENERATED
        - EVIDENCE_PACK_DOWNLOADED
        - CONFIG_CHANGE_PROPOSED
        - CONFIG_CHANGE_DECIDED
        - ACCESS_CHANGED
    Role: {type: string, enum: [ANALYST, APPROVER, CONFIG_ADMIN, SECURITY_ADMIN, VIEWER]}
    Permission:
      type: string
      description: Values used in `x-required-permission`.
      enum:
        - auth.self
        - run.view
        - run.reprocess
        - source.view
        - source.retry
        - source.supersede
        - exception.view
        - exception.assign
        - exception.investigate
        - exception.propose
        - exception.approve
        - exception.reopen
        - transaction.view
        - matching.view
        - matching.propose
        - ledger.view
        - safeguarding.view
        - safeguarding.adjustment.propose
        - safeguarding.adjustment.approve
        - signoff.view
        - signoff.prepare
        - signoff.decide
        - evidence.view
        - evidence.export
        - audit.view
        - settings.view
        - settings.draft
        - settings.approve
        - access.manage
        - approval.view
    Me:
      type: object
      required: [id, name, email, roles, legalEntityIds, permissions]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        legalEntityIds: {type: array, items: {type: string}}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
          description: Effective permissions (union over roles). UI uses these to show/hide actions; the server still enforces.
        permissionsByLegalEntity:
          type: object
          additionalProperties: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        apiVersion: {type: string}
    LegalEntity:
      type: object
      required: [id, name, currencies]
      properties:
        id: {type: string}
        name: {type: string}
        currencies: {type: array, items: {$ref: '#/components/schemas/Currency'}}
    Run:
      type: object
      required: [id, legalEntityId, businessDate, version, rulesetVersion, state, signOffState, startedAt, lastEvidenceArrivalAt]
      properties:
        id: {type: string}
        legalEntityId: {type: string}
        businessDate: {$ref: '#/components/schemas/IsoDate'}
        version: {type: integer, minimum: 1}
        supersededByRunId: {type: [string, 'null']}
        supersedesRunId: {type: [string, 'null']}
        rulesetVersion: {type: string}
        state: {$ref: '#/components/schemas/RunState'}
        signOffState: {$ref: '#/components/schemas/SignOffState'}
        startedAt: {type: string, format: date-time}
        lastEvidenceArrivalAt: {type: string, format: date-time}
        preparer: {oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]}
        requiredApprover: {oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]}
        signedOffBy: {oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]}
        signedOffAt: {type: [string, 'null'], format: date-time}
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    RunPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Run'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ControlAreaSummary:
      type: object
      required: [area, label, state, recordCount, value, openExceptions, previousRecordCount, changeFromPrevious]
      properties:
        area: {$ref: '#/components/schemas/ControlArea'}
        label: {type: string}
        state: {$ref: '#/components/schemas/ControlState'}
        recordCount: {type: integer}
        value: {type: array, items: {$ref: '#/components/schemas/Money'}, description: "One Money per currency"}
        openExceptions: {type: integer}
        previousRecordCount: {type: integer}
        changeFromPrevious: {type: integer}
    DailySummaryItem:
      type: object
      required: [text]
      properties:
        text: {type: string}
        link:
          type: object
          required: [kind, id]
          properties:
            kind: {type: string, enum: [exception, control, source]}
            id: {type: string}
    ControlRoom:
      type: object
      required: [run, summary, evidenceReadiness, controlAreas, attentionQueue, safeguarding]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        summary: {type: array, items: {$ref: '#/components/schemas/DailySummaryItem'}}
        evidenceReadiness: {type: array, items: {$ref: '#/components/schemas/SourceDelivery'}}
        controlAreas: {type: array, items: {$ref: '#/components/schemas/ControlAreaSummary'}}
        attentionQueue: {type: array, items: {$ref: '#/components/schemas/ExceptionSummary'}}
        safeguarding: {type: array, items: {$ref: '#/components/schemas/SafeguardingCurrencyPosition'}}
    RunComparison:
      type: object
      required: [run, against, controlAreas, newExceptionIds, resolvedExceptionIds]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        against: {$ref: '#/components/schemas/Run'}
        controlAreas:
          type: array
          items:
            type: object
            required: [area, state, againstState, recordCountDelta]
            properties:
              area: {$ref: '#/components/schemas/ControlArea'}
              state: {$ref: '#/components/schemas/ControlState'}
              againstState: {$ref: '#/components/schemas/ControlState'}
              recordCountDelta: {type: integer}
        newExceptionIds: {type: array, items: {type: string}}
        resolvedExceptionIds: {type: array, items: {type: string}}
        safeguardingDelta: {type: array, items: {$ref: '#/components/schemas/ChangeDriver'}}
        changedDeliveries: {type: array, items: {type: string}}
    SourceDelivery:
      type: object
      required: [deliveryId, sourceName, fileName, businessDate, schemaVersion, declaredRecordCount, actualRecordCount, declaredTotals, expectedBy, receivedAt, correctionOfDeliveryId, state, acceptedRecords, rejectedRecords, qualifications, findingIds]
      properties:
        deliveryId: {type: string}
        sourceName: {type: string}
        fileName: {type: string}
        businessDate: {$ref: '#/components/schemas/IsoDate'}
        schemaVersion: {type: string}
        declaredRecordCount: {type: integer}
        actualRecordCount: {type: integer}
        declaredTotals: {type: array, items: {$ref: '#/components/schemas/Money'}}
        expectedBy: {type: string, format: date-time}
        receivedAt: {type: [string, 'null'], format: date-time}
        correctionOfDeliveryId: {type: [string, 'null']}
        supersededByDeliveryId: {type: [string, 'null']}
        state: {$ref: '#/components/schemas/DeliveryState'}
        acceptedRecords: {type: integer}
        rejectedRecords: {type: integer}
        qualifications: {type: array, items: {type: string}}
        findingIds: {type: array, items: {type: string}, description: "Exception ids"}
    CheckResult:
      type: object
      required: [check, result]
      properties:
        check: {type: string, enum: [FINGERPRINT, DUPLICATE, SEQUENCE, SCHEMA, RECORD_COUNT, CONTROL_TOTALS]}
        result: {type: string, enum: [PASS, FAIL, WARN, NOT_APPLICABLE]}
        detail: {type: string}
        relatedDeliveryId: {type: [string, 'null'], description: "E.g. the duplicate or the previous sequence delivery"}
    SourceDeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/SourceDelivery'
        - type: object
          required: [fingerprint, checks]
          properties:
            fingerprint: {type: object, required: [algorithm, value], properties: {algorithm: {type: string, examples: [SHA-256]}, value: {type: string}}}
            sequenceNumber: {type: [integer, 'null']}
            extractionTimestamp: {type: [string, 'null'], format: date-time}
            sourceTimeZone: {type: [string, 'null']}
            checks: {type: array, items: {$ref: '#/components/schemas/CheckResult'}}
            actualTotals: {type: array, items: {$ref: '#/components/schemas/Money'}}
            allowedActions: {type: array, items: {type: string, enum: [RETRY_INGESTION, MARK_SUPERSEDED]}, description: "Server-computed from state and permissions"}
    ProcessingStep:
      type: object
      required: [id, at, stage, outcome]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        stage: {type: string, enum: [RECEIVED, FINGERPRINTED, SCHEMA_VALIDATED, RECORDS_PARSED, TOTALS_CHECKED, ACCEPTED, REJECTED, RETRIED, SUPERSEDED]}
        outcome: {type: string, enum: [OK, WARNING, ERROR]}
        actor: {$ref: '#/components/schemas/Actor'}
        message: {type: string}
    SourceRecord:
      type: object
      required: [recordId, sourceName, sourceRowId, deliveryId, rowNumber, accepted, fields, findingIds]
      properties:
        recordId: {type: string, description: 'New: stable id for GET /source-records/{recordId}'}
        sourceName: {type: string}
        sourceRowId: {type: string}
        deliveryId: {type: string}
        rowNumber: {type: integer}
        accepted: {type: boolean}
        fields: {type: object, additionalProperties: {type: string}, description: "Original values as received; amounts remain strings"}
        rejectionReasons: {type: array, items: {type: string}}
        contentFingerprint: {type: string}
        findingIds: {type: array, items: {type: string}}
    SourceRecordPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SourceRecord'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    Actor:
      type: object
      required: [type, id, name]
      properties:
        type: {$ref: '#/components/schemas/ActorType'}
        id: {type: string}
        name: {type: string}
    ExceptionSummary:
      type: object
      required: [id, runId, title, control, reasonCode, severity, status, value, legalEntityId, businessDate, owner, dueAt, blocking, sourceFile, sourceRowId, createdAt, etag]
      properties:
        id: {type: string, examples: [F-019]}
        runId: {type: string}
        title: {type: string}
        control: {$ref: '#/components/schemas/ControlArea'}
        reasonCode: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        status: {$ref: '#/components/schemas/ExceptionStatus'}
        value: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        legalEntityId: {type: string}
        businessDate: {$ref: '#/components/schemas/IsoDate'}
        owner: {oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}], description: 'Changed: object (id+name) instead of a bare string'}
        createdAt: {type: string, format: date-time}
        ageDays: {type: integer}
        dueAt: {type: string, format: date-time}
        blocking: {type: boolean}
        sourceFile: {type: string}
        sourceRowId: {type: string}
        etag: {type: string, description: "Same value as the ETag header of GET /exceptions/{id}; lets bulk commands avoid a read per item."}
    ExceptionPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExceptionSummary'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ExceptionsSummary:
      type: object
      required: [total, byCurrency, bySeverity, byStatus]
      description: Aggregates over the full filtered set.
      properties:
        total: {type: integer}
        blocking: {type: integer}
        unassigned: {type: integer}
        overdue: {type: integer}
        bySeverity: {type: object, additionalProperties: {type: integer}, propertyNames: {$ref: '#/components/schemas/Severity'}}
        byStatus: {type: object, additionalProperties: {type: integer}, propertyNames: {$ref: '#/components/schemas/ExceptionStatus'}}
        byControl: {type: object, additionalProperties: {type: integer}, propertyNames: {$ref: '#/components/schemas/ControlArea'}}
        byCurrency:
          type: array
          description: One entry per currency; sums never mix currencies.
          items:
            type: object
            required: [currency, count, totalValue, absoluteValue]
            properties:
              currency: {$ref: '#/components/schemas/Currency'}
              count: {type: integer}
              totalValue: {$ref: '#/components/schemas/Money'}
              absoluteValue: {$ref: '#/components/schemas/Money'}
        withoutValue: {type: integer, description: "Exceptions without a monetary value"}
        computedAt: {type: string, format: date-time}
    SavedViewInput:
      type: object
      required: [name, filters]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        shared: {type: boolean, default: false}
        filters: {type: object, additionalProperties: true, description: "Same keys and value shapes as the listExceptions query parameters"}
        sort: {type: string}
    SavedView:
      allOf:
        - $ref: '#/components/schemas/SavedViewInput'
        - type: object
          required: [id, owner, createdAt]
          properties:
            id: {type: string}
            owner: {$ref: '#/components/schemas/UserRef'}
            createdAt: {type: string, format: date-time}
    EvidenceNode:
      type: object
      required: [id, kind, label, source, sourceRowId, amount]
      properties:
        id: {type: string}
        kind: {type: string, enum: [INSTRUCTION, LEDGER_ENTRY, BANK_TRANSACTION, LIFECYCLE_EVENT, BALANCE, CONTROL_RESULT, DELIVERY]}
        label: {type: string}
        source: {type: string}
        sourceRowId: {type: string}
        recordId: {type: [string, 'null'], description: "Link to GET /source-records/{recordId} for preview"}
        amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
    EvidenceEdge:
      type: object
      required: [from, to, relation]
      properties:
        from: {type: string}
        to: {type: string}
        relation: {type: string}
    Lineage:
      type: object
      required: [subjectKind, subjectId, nodes, edges]
      properties:
        subjectKind: {type: string}
        subjectId: {type: string}
        nodes: {type: array, items: {$ref: '#/components/schemas/EvidenceNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/EvidenceEdge'}}
        deliveries:
          type: array
          items:
            type: object
            required: [deliveryId, fingerprint]
            properties:
              deliveryId: {type: string}
              fingerprint: {type: string}
              rowNumber: {type: [integer, 'null']}
              schemaVersion: {type: string}
              mappingVersion: {type: string}
    RuleTrace:
      type: object
      required: [control, ruleId, ruleVersion, inputs, tolerance, calculation, result]
      properties:
        control: {$ref: '#/components/schemas/ControlArea'}
        ruleId: {type: string}
        ruleVersion: {type: string}
        inputs: {type: array, items: {type: object, required: [name, value], properties: {name: {type: string}, value: {type: string}}}}
        tolerance: {type: string}
        calculation: {type: string}
        result: {type: string}
    TimelineEvent:
      type: object
      required: [id, at, actor, type, text]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
        type: {type: string, enum: [ASSIGNMENT, NOTE, EVIDENCE_REQUEST, STATUS_CHANGE, RESOLUTION_PROPOSED, APPROVAL, REOPENED, SYSTEM]}
        text: {type: string}
    Approval:
      type: object
      required: [id, objectType, objectId, proposalVersion, proposer, status, policyVersion, requiredRole, proposedAt]
      properties:
        id: {type: string}
        objectType: {$ref: '#/components/schemas/ApprovalObjectType'}
        objectId: {type: string}
        runId: {type: [string, 'null']}
        proposalVersion: {type: integer}
        proposer: {$ref: '#/components/schemas/UserRef'}
        approver: {oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]}
        requiredRole: {$ref: '#/components/schemas/Role'}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, INVALIDATED, EXPIRED]}
        decision: {type: [string, 'null'], enum: [APPROVE, REJECT, null]}
        rationale: {type: [string, 'null']}
        evidenceRefs: {type: array, items: {type: string}}
        policyVersion: {type: string}
        proposedAt: {type: string, format: date-time}
        decidedAt: {type: [string, 'null'], format: date-time}
        canDecide: {type: boolean, description: "False for the proposer or without permission/scope"}
    ApprovalObjectType: {type: string, enum: [EXCEPTION_RESOLUTION, SAFEGUARDING_ADJUSTMENT, MANUAL_MATCH, RUN_QUALIFICATION, RUN_SIGN_OFF, CONFIG_CHANGE, ACCESS_CHANGE]}
    ApprovalPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    ExceptionDetail:
      allOf:
        - $ref: '#/components/schemas/ExceptionSummary'
        - type: object
          required: [description, expectedEffect, summary, evidenceNodes, evidenceEdges, trace, timeline, states, relatedTransactionIds, relatedAccountIds, approvalPolicy, allowedActions]
          properties:
            description: {type: string}
            expectedEffect: {type: string}
            summary: {type: string}
            evidenceNodes: {type: array, items: {$ref: '#/components/schemas/EvidenceNode'}}
            evidenceEdges: {type: array, items: {$ref: '#/components/schemas/EvidenceEdge'}}
            trace: {$ref: '#/components/schemas/RuleTrace'}
            timeline: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
            states: {type: array, items: {type: string, enum: [WAITING_FOR_DATA, CONFLICTING_EVIDENCE, PENDING_EXTERNAL_ACTION, PENDING_APPROVAL, SUPERSEDED_RUN]}}
            relatedTransactionIds: {type: array, items: {type: string}}
            relatedAccountIds: {type: array, items: {type: string}}
            approvalPolicy: {type: string}
            pendingApproval: {oneOf: [{$ref: '#/components/schemas/Approval'}, {type: 'null'}]}
            approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
            allowedActions:
              type: array
              description: Server-computed from state, permission, scope and separation of duties.
              items: {type: string, enum: [ASSIGN, ADD_NOTE, REQUEST_EVIDENCE, PROPOSE_RESOLUTION, APPROVE_RESOLUTION, REJECT_RESOLUTION, REOPEN]}
    ResolutionProposalInput:
      type: object
      required: [kind, reason, evidenceRefs]
      properties:
        kind: {$ref: '#/components/schemas/ResolutionKind'}
        reason: {$ref: '#/components/schemas/Reason'}
        evidenceRefs: {type: array, items: {type: string}}
    DecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {$ref: '#/components/schemas/Reason'}
        proposalVersion: {type: integer, description: "Version the approver reviewed; stale -> 409"}
    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [exceptionId, status]
            properties:
              exceptionId: {type: string}
              status: {type: integer, description: "HTTP-style status for this item"}
              etag: {type: string}
              problem: {$ref: '#/components/schemas/Problem'}
    Transaction:
      type: object
      required: [id, runId, kind, source, sourceRowId, reference, accountId, timestamp, amount, direction, sourceStatus, lifecycle, matchStatus, matchGroupId, exceptionIds, accepted]
      properties:
        id: {type: string}
        runId: {type: string}
        kind: {$ref: '#/components/schemas/TransactionKind'}
        source: {type: string}
        sourceRowId: {type: string}
        recordId: {type: [string, 'null']}
        deliveryId: {type: [string, 'null']}
        reference: {type: string}
        accountId: {type: [string, 'null']}
        timestamp: {type: string, format: date-time}
        amount: {$ref: '#/components/schemas/Money'}
        direction: {type: [string, 'null'], enum: [DEBIT, CREDIT, null]}
        sourceStatus: {type: string}
        lifecycle: {type: array, items: {type: string}}
        matchStatus: {$ref: '#/components/schemas/MatchStatus'}
        matchGroupId: {type: [string, 'null']}
        exceptionIds: {type: array, items: {type: string}}
        accepted: {type: boolean}
    TransactionPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        aggregates:
          type: array
          description: Per-currency totals over the full filtered set.
          items:
            type: object
            required: [currency, count, debitTotal, creditTotal]
            properties:
              currency: {$ref: '#/components/schemas/Currency'}
              count: {type: integer}
              debitTotal: {$ref: '#/components/schemas/Money'}
              creditTotal: {$ref: '#/components/schemas/Money'}
    MatchCandidate:
      type: object
      required: [transactionId, label, amount, timestamp, reference]
      properties:
        transactionId: {type: string}
        label: {type: string}
        amount: {$ref: '#/components/schemas/Money'}
        timestamp: {type: string, format: date-time}
        reference: {type: string}
    MatchGroup:
      type: object
      required: [id, status, left, right, difference, ruleVersion, tolerance, rationale, exceptionIds]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/MatchStatus'}
        left: {type: array, items: {$ref: '#/components/schemas/MatchCandidate'}}
        right: {type: array, items: {$ref: '#/components/schemas/MatchCandidate'}}
        difference: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        ruleVersion: {type: string}
        tolerance: {type: string}
        rationale: {type: string}
        exceptionIds: {type: array, items: {type: string}}
        manual: {type: boolean, description: "True when created by a user"}
        approval: {oneOf: [{$ref: '#/components/schemas/Approval'}, {type: 'null'}]}
    MatchGroupPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MatchGroup'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    MatchingWorkbench:
      type: object
      required: [focusTransactionId, groups, unmatched]
      properties:
        focusTransactionId: {type: string}
        groups: {type: array, items: {$ref: '#/components/schemas/MatchGroup'}}
        unmatched: {type: array, items: {$ref: '#/components/schemas/MatchCandidate'}}
    Account:
      type: object
      required: [id, runId, currency, legalEntityId, openingBalance, recordedClosingBalance, independentClosingBalance, difference, state, exceptionIds]
      properties:
        id: {type: string}
        runId: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        legalEntityId: {type: string}
        openingBalance: {$ref: '#/components/schemas/Money'}
        recordedClosingBalance: {$ref: '#/components/schemas/Money'}
        independentClosingBalance: {$ref: '#/components/schemas/Money'}
        difference: {$ref: '#/components/schemas/Money'}
        state: {$ref: '#/components/schemas/ControlState'}
        exceptionIds: {type: array, items: {type: string}}
    AccountPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Account'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        aggregates:
          type: array
          items:
            type: object
            required: [currency, accounts, totalDifference]
            properties:
              currency: {$ref: '#/components/schemas/Currency'}
              accounts: {type: integer}
              totalDifference: {$ref: '#/components/schemas/Money'}
    LedgerEntry:
      type: object
      required: [id, accountId, timestamp, valueDate, direction, amount, reference, entryType, sourceStatus, exceptionIds]
      properties:
        id: {type: string}
        accountId: {type: string}
        timestamp: {type: string, format: date-time}
        valueDate: {$ref: '#/components/schemas/IsoDate'}
        direction: {type: string, enum: [DEBIT, CREDIT]}
        amount: {$ref: '#/components/schemas/Money'}
        reference: {type: string}
        entryType: {type: string}
        sourceStatus: {type: string}
        recordId: {type: [string, 'null']}
        exceptionIds: {type: array, items: {type: string}}
    AccountLedgerView:
      type: object
      required: [account, entries, rollForward, relatedTransactions, exceptions]
      properties:
        account: {$ref: '#/components/schemas/Account'}
        entries: {type: array, items: {$ref: '#/components/schemas/LedgerEntry'}}
        entriesPage: {$ref: '#/components/schemas/PageInfo'}
        rollForward: {type: array, items: {type: object, required: [label, amount], properties: {label: {type: string}, amount: {$ref: '#/components/schemas/Money'}}}}
        relatedTransactions: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        exceptions: {type: array, items: {$ref: '#/components/schemas/ExceptionSummary'}}
    SafeguardingCurrencyPosition:
      type: object
      required: [currency, obligation, eligibleBalance, approvedAdjustments, result, state, qualifications, previousResult, exceptionIds]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        obligation: {$ref: '#/components/schemas/Money'}
        eligibleBalance: {$ref: '#/components/schemas/Money'}
        approvedAdjustments: {$ref: '#/components/schemas/Money'}
        result: {$ref: '#/components/schemas/Money'}
        state: {$ref: '#/components/schemas/SafeguardingState'}
        qualifications: {type: array, items: {type: string}}
        previousResult: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        exceptionIds: {type: array, items: {type: string}}
    ObligationLine:
      type: object
      required: [accountId, currency, amount, movementType]
      properties:
        accountId: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        amount: {$ref: '#/components/schemas/Money'}
        movementType: {type: string}
    EligibleBalanceLine:
      type: object
      required: [sourceRowId, externalAccountId, balanceTimestamp, balance, evidenceReference, included, reason, findingIds]
      properties:
        sourceRowId: {type: string}
        recordId: {type: [string, 'null']}
        externalAccountId: {type: string}
        balanceTimestamp: {type: string, format: date-time}
        balance: {$ref: '#/components/schemas/Money'}
        evidenceReference: {type: [string, 'null']}
        included: {type: boolean}
        reason: {type: string}
        findingIds: {type: array, items: {type: string}}
    ChangeDriver:
      type: object
      required: [label, currency, change]
      properties:
        label: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        change: {$ref: '#/components/schemas/Money'}
    AdjustmentInput:
      type: object
      required: [currency, amount, reason, evidenceRefs]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        amount: {$ref: '#/components/schemas/Money'}
        reason: {$ref: '#/components/schemas/Reason'}
        evidenceRefs: {type: array, minItems: 1, items: {type: string}}
        expiresOn: {type: [string, 'null'], format: date}
    SafeguardingAdjustment:
      type: object
      required: [id, runId, currency, amount, status, owner, reason, evidenceRefs, history]
      properties:
        id: {type: string}
        runId: {type: string}
        currency: {$ref: '#/components/schemas/Currency'}
        amount: {$ref: '#/components/schemas/Money'}
        status: {$ref: '#/components/schemas/AdjustmentStatus'}
        owner: {$ref: '#/components/schemas/UserRef'}
        reason: {type: string}
        evidenceRefs: {type: array, items: {type: string}}
        expiresOn: {type: [string, 'null'], format: date}
        approval: {oneOf: [{$ref: '#/components/schemas/Approval'}, {type: 'null'}]}
        history: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
    SafeguardingPosition:
      type: object
      required: [runId, businessDate, legalEntityId, evidenceReadiness, approvalState, positions, obligations, eligibleBalances, adjustments, changeAnalysis]
      properties:
        runId: {type: string}
        businessDate: {$ref: '#/components/schemas/IsoDate'}
        legalEntityId: {type: string}
        evidenceReadiness: {type: string, enum: [COMPLETE, QUALIFIED, INCOMPLETE]}
        approvalState: {$ref: '#/components/schemas/SignOffState'}
        positions: {type: array, items: {$ref: '#/components/schemas/SafeguardingCurrencyPosition'}}
        obligations: {type: array, items: {$ref: '#/components/schemas/ObligationLine'}}
        eligibleBalances: {type: array, items: {$ref: '#/components/schemas/EligibleBalanceLine'}}
        adjustments: {type: array, items: {$ref: '#/components/schemas/SafeguardingAdjustment'}}
        changeAnalysis: {type: array, items: {$ref: '#/components/schemas/ChangeDriver'}}
    ChecklistItem:
      type: object
      required: [id, control, label, state, mandatory, note, exceptionIds]
      properties:
        id: {type: string}
        control: {$ref: '#/components/schemas/ControlArea'}
        label: {type: string}
        state: {$ref: '#/components/schemas/ControlState'}
        mandatory: {type: boolean}
        note: {type: string}
        exceptionIds: {type: array, items: {type: string}}
    RunSignOff:
      type: object
      required: [run, checklist, openMatters, changesSincePreparation, attestationText, canSignOff, blockers, evidencePackId]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        checklist: {type: array, items: {$ref: '#/components/schemas/ChecklistItem'}}
        openMatters: {type: array, items: {$ref: '#/components/schemas/ExceptionSummary'}}
        qualifications: {type: array, items: {type: string}}
        changesSincePreparation: {type: array, items: {type: string}}
        attestationText: {type: string}
        attestationTextHash: {type: string}
        canSignOff: {type: boolean, description: "Server-evaluated for the current caller (blockers, scope, separation of duties)"}
        blockers: {type: array, items: {type: string}}
        evidencePackId: {type: [string, 'null']}
        approval: {oneOf: [{$ref: '#/components/schemas/Approval'}, {type: 'null'}]}
        history: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
    AuditEvent:
      type: object
      required: [id, at, actor, type, runId, subjectKind, subjectId, summary, ruleVersion, hash]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
        type: {$ref: '#/components/schemas/AuditEventType'}
        runId: {type: [string, 'null']}
        subjectKind: {$ref: '#/components/schemas/AuditSubjectKind'}
        subjectId: {type: string}
        summary: {type: string}
        reason: {type: [string, 'null']}
        ruleVersion: {type: [string, 'null']}
        requestId: {type: [string, 'null']}
        hash: {type: string}
        previousHash: {type: [string, 'null']}
    AuditEventPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    EvidencePack:
      type: object
      required: [id, runId, generatedAt, status, contents]
      properties:
        id: {type: string}
        runId: {type: string}
        generatedAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [NOT_GENERATED, GENERATING, GENERATED, FAILED]}
        contents: {type: array, items: {type: string}}
        sha256: {type: [string, 'null']}
        sizeBytes: {type: [integer, 'null']}
    RuleConfig:
      type: object
      required: [ruleId, control, version, description, tolerance, severity, effectiveFrom]
      properties:
        ruleId: {type: string}
        control: {$ref: '#/components/schemas/ControlArea'}
        version: {type: string}
        description: {type: string}
        tolerance: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        effectiveFrom: {$ref: '#/components/schemas/IsoDate'}
        pendingChangeId: {type: [string, 'null']}
    SourceConfig:
      type: object
      required: [sourceName, schemaVersion, expectedByLocalTime, mandatory]
      properties:
        sourceName: {type: string}
        schemaVersion: {type: string}
        expectedByLocalTime: {type: string, examples: ['08:00']}
        mandatory: {type: boolean}
        pendingChangeId: {type: [string, 'null']}
    UserAccess:
      type: object
      required: [id, name, email, roles, legalEntityIds]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        legalEntityIds: {type: array, items: {type: string}}
        pendingChangeId: {type: [string, 'null']}
    ApprovalPolicy:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description: {type: string}
        requiredRole: {$ref: '#/components/schemas/Role'}
        version: {type: string}
    Settings:
      type: object
      required: [legalEntity, rules, sources, users, freshnessPolicy, approvalPolicies, pendingChanges]
      properties:
        legalEntity: {$ref: '#/components/schemas/LegalEntity'}
        rules: {type: array, items: {$ref: '#/components/schemas/RuleConfig'}}
        sources: {type: array, items: {$ref: '#/components/schemas/SourceConfig'}}
        users: {type: array, items: {$ref: '#/components/schemas/UserAccess'}, description: "Omitted unless caller has access.manage or settings.view"}
        freshnessPolicy: {type: string}
        approvalPolicies: {type: array, items: {$ref: '#/components/schemas/ApprovalPolicy'}}
        pendingChanges: {type: integer, description: "Count of changes awaiting approval"}
    ConfigTargetKind: {type: string, enum: [RULE, SOURCE, USER_ACCESS, APPROVAL_POLICY]}
    ConfigChangeStatus: {type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, ACTIVE, REJECTED, RETIRED]}
    ConfigChangeInput:
      type: object
      required: [targetKind, targetId, after, effectiveFrom, reason]
      properties:
        targetKind: {$ref: '#/components/schemas/ConfigTargetKind'}
        targetId: {type: string}
        after: {type: object, additionalProperties: true, description: "Proposed full object of the target kind (RuleConfig, SourceConfig, UserAccess, ...)"}
        effectiveFrom: {$ref: '#/components/schemas/IsoDate'}
        reason: {$ref: '#/components/schemas/Reason'}
    ConfigChange:
      type: object
      required: [id, targetKind, targetId, status, before, after, proposer, proposedAt, effectiveFrom, reason, material]
      properties:
        id: {type: string}
        targetKind: {$ref: '#/components/schemas/ConfigTargetKind'}
        targetId: {type: string}
        status: {$ref: '#/components/schemas/ConfigChangeStatus'}
        material: {type: boolean, description: "Material changes need a second person"}
        before: {type: [object, 'null'], additionalProperties: true}
        after: {type: object, additionalProperties: true}
        diff: {type: array, items: {type: object, required: [path], properties: {path: {type: string}, from: {}, to: {}}}}
        proposer: {$ref: '#/components/schemas/UserRef'}
        proposedAt: {type: string, format: date-time}
        approval: {oneOf: [{$ref: '#/components/schemas/Approval'}, {type: 'null'}]}
        effectiveFrom: {$ref: '#/components/schemas/IsoDate'}
        reason: {type: string}
    ConfigChangePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ConfigChange'}}
        page: {$ref: '#/components/schemas/PageInfo'}
