      x-required-permission: safeguarding.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/SafeguardingPosition'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/safeguarding/adjustments:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Safeguarding]
      operationId: listAdjustments
