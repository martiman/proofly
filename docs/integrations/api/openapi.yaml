      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdjustmentInput'}}}
      responses:
        '201': {description: "Created", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SafeguardingAdjustment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /safeguarding/adjustments/{adjustmentId}/decision:
    parameters: [{name: adjustmentId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Safeguarding]
      operationId: decideAdjustment
      summary: Approve or reject an adjustment (not your own proposal)
      x-required-permission: safeguarding.adjustment.approve
      x-audit-event: ADJUSTMENT_DECIDED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DecisionInput'}}}
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SafeguardingAdjustment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /runs/{runId}/sign-off:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [SignOff]
      operationId: getRunSignOff
      summary: Sign-off pack (checklist, open matters, preparer, required approver, blockers)
      x-required-permission: signoff.view
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunSignOff'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/sign-off/submit:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [SignOff]
      operationId: submitRunForSignOff
      summary: Preparer submits the run for review; fixes the preparer and required approver
      x-required-permission: signoff.prepare
      x-audit-event: SIGN_OFF_SUBMITTED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requiredApproverId: {type: string, description: "Optional; defaults to policy"}
                note: {type: string, maxLength: 2000}
      responses: &signOffResponses
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunSignOff'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /runs/{runId}/sign-off/return:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [SignOff]
      operationId: returnRun
      summary: Return the run to the preparer
      x-required-permission: signoff.decide
      x-audit-event: SIGN_OFF_RETURNED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ReasonOnly'}
      responses: *signOffResponses
  /runs/{runId}/sign-off/approve:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [SignOff]
      operationId: signOffRun
      summary: Sign off the run
      description: |
        Requires attestation, no unresolved mandatory blockers, and approver != preparer
        (403 `separation-of-duties`). The ETag must match the sign-off pack the approver saw,
        so changes since preparation invalidate the attempt (409 `stale-signoff`).
      x-required-permission: signoff.decide
      x-audit-event: RUN_SIGNED_OFF
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation, reason]
              properties:
                attestation: {type: boolean, const: true}
                attestationTextHash: {type: string, description: "Hash of the attestation text shown to the approver"}
