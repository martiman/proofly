        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/evidence-pack/download:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Audit]
      operationId: downloadEvidencePack
      summary: Download the generated evidence pack (audited)
      x-required-permission: evidence.export
      x-audit-event: EVIDENCE_PACK_DOWNLOADED
      responses:
        '200': {description: "Evidence pack archive", content: {application/zip: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Audit events (append-only, hash-chained)
      x-required-permission: audit.view
      parameters:
        - {name: runId, in: query, schema: {type: string}}
        - {name: subjectKind, in: query, schema: {$ref: '#/components/schemas/AuditSubjectKind'}}
        - {name: subjectId, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/AuditEventType'}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: actorType, in: query, schema: {$ref: '#/components/schemas/ActorType'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /lineage/{subjectKind}/{subjectId}:
    get:
      tags: [Audit]
      operationId: getLineage
      summary: Lineage graph for any subject (exception, transaction, record, control result)
      x-required-permission: evidence.view
      parameters:
        - {name: subjectKind, in: path, required: true, schema: {type: string, enum: [EXCEPTION, TRANSACTION, RECORD, CONTROL_RESULT]}}
        - {name: subjectId, in: path, required: true, schema: {type: string}}
        - {name: runId, in: query, schema: {type: string}}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/Lineage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Active configuration, users, approval policies and pending-change count
      x-required-permission: settings.view
      parameters: [{name: legalEntityId, in: query, schema: {type: string}}]
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /settings/changes:
    get:
      tags: [Settings]
      operationId: listConfigChanges
      summary: Configuration change history and pending changes
      x-required-permission: settings.view
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ConfigChangeStatus'}}
        - {name: targetKind, in: query, schema: {$ref: '#/components/schemas/ConfigTargetKind'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/ConfigChangePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Settings]
      operationId: proposeConfigChange
      summary: Draft/propose a configuration or access change
      x-required-permission: settings.draft
      x-audit-event: CONFIG_CHANGE_PROPOSED
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConfigChangeInput'}}}
      responses:
        '201': {description: "Created", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigChange'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /settings/changes/{changeId}:
    parameters: [{name: changeId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Settings]
      operationId: getConfigChange
      summary: One configuration change with diff and approvals
      x-required-permission: settings.view
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigChange'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
