        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/AccountPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/accounts/{accountId}/ledger:
    parameters: [{$ref: '#/components/parameters/RunId'}, {name: accountId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Accounts]
      operationId: getAccountLedger
      summary: Account ledger view with roll-forward, related transactions and exceptions
      x-required-permission: ledger.view
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/AccountLedgerView'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/safeguarding:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
