      x-required-permission: safeguarding.view
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/AdjustmentStatus'}}]
      responses:
        '200': {description: "OK", content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SafeguardingAdjustment'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Safeguarding]
      operationId: proposeAdjustment
      summary: Propose a safeguarding adjustment
      x-required-permission: safeguarding.adjustment.propose
