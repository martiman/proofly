openapi: 3.1.0
info:
  title: Proofly Control API
  version: 0.1.0-draft
  summary: Backend contract for the Proofly web application (oMVP).
  description: |
    REST/JSON contract between the Proofly web app and the customer-hosted backend.
    Conventions (money, pagination, errors, concurrency, idempotency, run scoping) are
    described in `README.md` next to this file and are normative.

    Key rules:
    - Money is `{amount: decimal string, currency: ISO 4217}`; never a float.
    - All control state is scoped to a **run version** (`runId`). A superseded run is read-only.
    - Mutations carry `If-Match` (ETag of the target) and, for commands, `Idempotency-Key`.
    - Material decisions require a non-empty `reason` and always write an audit event.
    - Aggregates and totals are computed server-side.
    - Errors are RFC 9457 `application/problem+json`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: proofly.customer.internal
tags:
  - {name: Auth, description: "Current user, roles, scope and permissions"}
  - {name: Runs, description: "Control runs and the control room"}
  - {name: Sources, description: "Source deliveries, records, ingestion"}
  - {name: Exceptions, description: "Exception queue and workflow commands"}
  - {name: Transactions, description: "Normalised transactions and lineage"}
  - {name: Matching, description: "Match groups and workbench"}
  - {name: Accounts, description: "Accounts and independent ledger"}
  - {name: Safeguarding, description: "Safeguarding position and adjustments"}
  - {name: SignOff, description: "Run sign-off workflow"}
  - {name: Audit, description: "Audit events and evidence packs"}
  - {name: Settings, description: "Configuration, access and change approvals"}
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, roles, legal-entity scope and effective permissions
      x-required-permission: auth.self
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /legal-entities:
    get:
      tags: [Auth]
      operationId: listLegalEntities
      summary: Legal entities in the caller's scope
      x-required-permission: run.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LegalEntity'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs (all versions) in scope
      x-required-permission: run.view
      parameters:
        - {name: legalEntityId, in: query, schema: {type: string}}
        - {name: businessDate, in: query, schema: {type: string, format: date}}
        - {name: includeSuperseded, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/RunPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /runs/{runId}:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get one run version
      x-required-permission: run.view
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/control-room:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: getControlRoom
      summary: Control room aggregate for a run
      x-required-permission: run.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/ControlRoom'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/reprocess:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Runs]
      operationId: requestRunReprocess
      summary: Request reprocessing, creating a new run version that supersedes this one
      x-required-permission: run.reprocess
      x-audit-event: RUN_REPROCESS_REQUESTED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ReasonOnly'}
      responses:
        '202': {description: "Accepted; new run version is being created", content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /runs/{runId}/compare:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Runs]
      operationId: compareRuns
      summary: Compare this run with another run version or the previous business date
      x-required-permission: run.view
      parameters:
        - {name: against, in: query, required: true, description: "Run id to compare with", schema: {type: string}}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/RunComparison'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/deliveries:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Sources]
      operationId: listSourceDeliveries
      summary: Source deliveries (incl. missing/expected) for a run
      x-required-permission: source.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SourceDelivery'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deliveries/{deliveryId}:
    parameters: [{$ref: '#/components/parameters/DeliveryId'}]
    get:
      tags: [Sources]
      operationId: getSourceDelivery
      summary: Delivery with fingerprint, duplicate and sequence checks
      x-required-permission: source.view
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SourceDeliveryDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deliveries/{deliveryId}/processing-history:
    parameters: [{$ref: '#/components/parameters/DeliveryId'}]
    get:
      tags: [Sources]
      operationId: getDeliveryProcessingHistory
      summary: Processing history of a delivery (ingestion attempts, validation, retries)
      x-required-permission: source.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ProcessingStep'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deliveries/{deliveryId}/records:
    parameters: [{$ref: '#/components/parameters/DeliveryId'}]
    get:
      tags: [Sources]
      operationId: listDeliveryRecords
      summary: Records of a delivery
      x-required-permission: source.view
      parameters:
        - {name: accepted, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/SourceRecordPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deliveries/{deliveryId}/retry-ingestion:
    parameters: [{$ref: '#/components/parameters/DeliveryId'}]
    post:
      tags: [Sources]
      operationId: retryDeliveryIngestion
      summary: Retry ingestion of a rejected or failed delivery
      x-required-permission: source.retry
      x-audit-event: DELIVERY_INGESTION_RETRIED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ReasonOnly'}
      responses:
        '202': {description: "Accepted", content: {application/json: {schema: {$ref: '#/components/schemas/SourceDeliveryDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /deliveries/{deliveryId}/mark-superseded:
    parameters: [{$ref: '#/components/parameters/DeliveryId'}]
    post:
      tags: [Sources]
      operationId: markDeliverySuperseded
      summary: Mark a delivery as superseded by a correction delivery
      description: The original is never overwritten; this records the supersession link.
      x-required-permission: source.supersede
      x-audit-event: DELIVERY_SUPERSEDED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersededByDeliveryId, reason]
              properties:
                supersededByDeliveryId: {type: string}
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/SourceDeliveryDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /source-records/{recordId}:
    get:
      tags: [Sources]
      operationId: getSourceRecord
      summary: Evidence record preview (original fields, location, fingerprint)
      x-required-permission: source.view
      parameters: [{name: recordId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/SourceRecord'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/exceptions:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Exceptions]
      operationId: listExceptions
      summary: Exceptions queue with server-side filters
      x-required-permission: exception.view
      parameters:
        - {name: severity, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/Severity'}}}
        - {name: control, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/ControlArea'}}}
        - {name: status, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/ExceptionStatus'}}}
        - {name: ownerId, in: query, schema: {type: string}}
        - {name: unassigned, in: query, schema: {type: boolean}}
        - {name: blocking, in: query, schema: {type: boolean}}
        - {name: legalEntityId, in: query, schema: {type: string}}
        - {name: currency, in: query, schema: {$ref: '#/components/schemas/Currency'}}
        - {name: valueMin, in: query, description: "Absolute value lower bound (decimal string); requires currency", schema: {$ref: '#/components/schemas/DecimalString'}}
        - {name: valueMax, in: query, description: "Absolute value upper bound (decimal string); requires currency", schema: {$ref: '#/components/schemas/DecimalString'}}
        - {name: businessDateFrom, in: query, schema: {type: string, format: date}}
        - {name: businessDateTo, in: query, schema: {type: string, format: date}}
        - {name: ageDaysMin, in: query, schema: {type: integer, minimum: 0}}
        - {name: ageDaysMax, in: query, schema: {type: integer, minimum: 0}}
        - {name: dueBefore, in: query, schema: {type: string, format: date-time}}
        - {name: savedViewId, in: query, description: "Apply a saved view's filters (explicit params override)", schema: {type: string}}
        - {name: sort, in: query, description: 'Comma list, prefix - for desc. Default: -severity,dueAt,id', schema: {type: string, default: '-severity,dueAt,id'}}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/IncludeTotal'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /runs/{runId}/exceptions/summary:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Exceptions]
      operationId: getExceptionsSummary
      summary: Server-side totals and per-currency aggregates for the queue
      description: Accepts the same filters as `listExceptions` (omitted here for brevity in the schema; see that operation) and aggregates over the full filtered set, not the current page.
      x-required-permission: exception.view
      parameters:
        - {name: severity, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/Severity'}}}
        - {name: control, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/ControlArea'}}}
        - {name: status, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/ExceptionStatus'}}}
        - {name: ownerId, in: query, schema: {type: string}}
        - {name: unassigned, in: query, schema: {type: boolean}}
        - {name: currency, in: query, schema: {$ref: '#/components/schemas/Currency'}}
        - {name: savedViewId, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Search'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionsSummary'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/exceptions/bulk-assign:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post:
      tags: [Exceptions]
      operationId: bulkAssignExceptions
      summary: Assign several exceptions to one owner
      description: Per-item results; each item is checked against its own ETag. Partial success returns 207.
      x-required-permission: exception.assign
      x-audit-event: EXCEPTION_ASSIGNED
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, ownerId]
              properties:
                ownerId: {type: string}
                note: {type: string, maxLength: 2000}
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [exceptionId, etag]
                    properties:
                      exceptionId: {type: string}
                      etag: {type: string}
      responses:
        '200': {description: "All assigned", content: {application/json: {schema: {$ref: '#/components/schemas/BulkResult'}}}}
        '207': {description: "Partial success", content: {application/json: {schema: {$ref: '#/components/schemas/BulkResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /exception-views:
    get:
      tags: [Exceptions]
      operationId: listExceptionViews
      summary: Saved queue views of the current user (and shared views)
      x-required-permission: exception.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Exceptions]
      operationId: createExceptionView
      summary: Save a queue view
      x-required-permission: exception.view
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SavedViewInput'}}}
      responses:
        '201': {description: "Created", content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /exception-views/{viewId}:
    parameters: [{name: viewId, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [Exceptions]
      operationId: deleteExceptionView
      summary: Delete a saved view (personal preference; not a material decision)
      x-required-permission: exception.view
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: "Deleted"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /exceptions/{exceptionId}:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    get:
      tags: [Exceptions]
      operationId: getException
      summary: Exception detail with evidence graph, rule trace, timeline and approvals
      x-required-permission: exception.view
      responses:
        '200': {description: "OK", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /exceptions/{exceptionId}/assign:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    post:
      tags: [Exceptions]
      operationId: assignException
      summary: Assign or reassign an exception owner
      x-required-permission: exception.assign
      x-audit-event: EXCEPTION_ASSIGNED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId]
              properties:
                ownerId: {type: [string, 'null'], description: "Null unassigns"}
                note: {type: string, maxLength: 2000}
      responses: &exceptionCommandResponses
        '200': {description: "OK; returns updated exception", headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /exceptions/{exceptionId}/notes:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    post:
      tags: [Exceptions]
      operationId: addExceptionNote
      summary: Add a note (immutable timeline entry)
      x-required-permission: exception.investigate
      x-audit-event: NOTE_ADDED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 4000}}}}}
      responses: *exceptionCommandResponses
  /exceptions/{exceptionId}/request-evidence:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    post:
      tags: [Exceptions]
      operationId: requestExceptionEvidence
      summary: Request additional evidence; moves status to WAITING_FOR_DATA
      x-required-permission: exception.investigate
      x-audit-event: EVIDENCE_REQUESTED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 4000}
                requestedFrom: {type: string, description: "Free text or source name"}
      responses: *exceptionCommandResponses
  /exceptions/{exceptionId}/resolution-proposals:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    post:
      tags: [Exceptions]
      operationId: proposeResolution
      summary: Propose a resolution; creates an approval request
      description: |
        Moves status to PENDING_APPROVAL. The original control result is retained.
        The approval policy (by severity/blocking) determines the required approver role.
      x-required-permission: exception.propose
      x-audit-event: RESOLUTION_PROPOSED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolutionProposalInput'}}}
      responses: *exceptionCommandResponses
  /exceptions/{exceptionId}/resolution-proposals/{proposalId}/decision:
    parameters:
      - {$ref: '#/components/parameters/ExceptionId'}
      - {name: proposalId, in: path, required: true, schema: {type: string}}
    post:
      tags: [Exceptions]
      operationId: decideResolution
      summary: Approve or reject a resolution proposal
      description: Separation of duties — the proposer cannot decide (403 `separation-of-duties`). `If-Match` must be the ETag of the exception and a stale proposal version returns 409.
      x-required-permission: exception.approve
      x-audit-event: RESOLUTION_DECIDED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DecisionInput'}}}
      responses: *exceptionCommandResponses
  /exceptions/{exceptionId}/reopen:
    parameters: [{$ref: '#/components/parameters/ExceptionId'}]
    post:
      tags: [Exceptions]
      operationId: reopenException
      summary: Reopen a closed exception
      x-required-permission: exception.reopen
      x-audit-event: EXCEPTION_REOPENED
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ReasonOnly'}
      responses: *exceptionCommandResponses
  /runs/{runId}/transactions:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Normalised transactions
      x-required-permission: transaction.view
      parameters:
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/TransactionKind'}}
        - {name: matchStatus, in: query, schema: {$ref: '#/components/schemas/MatchStatus'}}
        - {name: accountId, in: query, schema: {type: string}}
        - {name: currency, in: query, schema: {$ref: '#/components/schemas/Currency'}}
        - {name: hasException, in: query, schema: {type: boolean}}
        - {name: timestampFrom, in: query, schema: {type: string, format: date-time}}
        - {name: timestampTo, in: query, schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/IncludeTotal'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/TransactionPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/transactions/{transactionId}:
    parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/TransactionId'}]
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Transaction detail
      x-required-permission: transaction.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/transactions/{transactionId}/lineage:
    parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/TransactionId'}]
    get:
      tags: [Transactions]
      operationId: getTransactionLineage
      summary: Lineage from normalised event back to delivery, record location and fingerprint
      x-required-permission: transaction.view
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/Lineage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/matching/workbench:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Matching]
      operationId: getMatchingWorkbench
      summary: Matching workbench focused on a transaction or an exception
      x-required-permission: matching.view
      parameters:
        - {name: transactionId, in: query, schema: {type: string}}
        - {name: exceptionId, in: query, schema: {type: string}}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/MatchingWorkbench'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /runs/{runId}/match-groups:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      tags: [Matching]
      operationId: listMatchGroups
      summary: Match groups
      x-required-permission: matching.view
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MatchStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: "OK", content: {application/json: {schema: {$ref: '#/components/schemas/MatchGroupPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Matching]
      operationId: proposeManualMatch
      summary: Propose a manual match (material manual matches require approval)
      x-required-permission: matching.propose
      x-audit-event: MANUAL_MATCH_PROPOSED
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leftTransactionIds, rightTransactionIds, reason]
              properties:
                leftTransactionIds: {type: array, minItems: 1, items: {type: string}}
                rightTransactionIds: {type: array, minItems: 1, items: {type: string}}
