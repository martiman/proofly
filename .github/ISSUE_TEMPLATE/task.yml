name: Task
description: A unit of implementation work
labels: ["type/feature"]
body:
  - type: textarea
    id: goal
    attributes: {label: Goal, description: What and why in two or three sentences}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist; link to docs/testing/omvp-acceptance-plan.md where relevant
      placeholder: "- [ ] ..."
    validations: {required: true}
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Screen spec, OpenAPI operationIds, ADRs, pen frame ids, synthetic data files
  - type: textarea
    id: deps
    attributes: {label: Dependencies, description: "Blocked by #n"}
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      value: "- [ ] Build and tests pass\n- [ ] Verified against the spec/design (screenshot or test output)\n- [ ] Summary commented on this issue"
